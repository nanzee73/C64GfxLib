# Releases a new version: Actions ▸ Release ▸ Run workflow, enter e.g. 0.2.0.
# Tests, sets the git tag 0.2.0, and lets JitPack build it, so the apps can use
#   com.github.nanzee73.C64GfxLib:c64gfx-swing:0.2.0
# (Setting the tag by hand or creating a GitHub release with that tag works too; JitPack then builds on first use.)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 (becomes the git tag)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      V: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            echo "::error::Tag $V exists already"; exit 1
          fi
          git tag "$V"
          git push origin "refs/tags/$V"

      - name: Build on JitPack
        run: |
          base="https://jitpack.io/com/github/nanzee73/C64GfxLib"
          curl -s -m 30 "$base/$V/build.log" > /dev/null || true   # starts the build
          for i in $(seq 1 60); do
            if curl -sf -m 30 -o /dev/null "$base/c64gfx-swing/$V/c64gfx-swing-$V.pom"; then
              echo "JitPack: com.github.nanzee73.C64GfxLib:c64gfx-swing:$V is available"; exit 0
            fi
            sleep 15
          done
          curl -s "$base/$V/build.log" | tail -60
          echo "::error::JitPack did not finish, see https://jitpack.io/#nanzee73/C64GfxLib/$V"; exit 1
