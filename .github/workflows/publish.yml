# Tests on every push. Publishes version X.Y.Z of c64gfx-core and c64gfx-swing to GitHub Packages when
#  - a tag vX.Y.Z is pushed (or a release with a new tag is created on GitHub), or
#  - the workflow is started by hand (Actions ▸ Build & Publish ▸ Run workflow) with a version.
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0 (empty = only test)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          V="0.0.0-SNAPSHOT"; P=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; P=true; fi
          if [[ -n "${{ github.event.inputs.version }}" ]]; then V="${{ github.event.inputs.version }}"; P=true; fi
          echo "LIB_VERSION=$V" >> "$GITHUB_ENV"
          echo "PUBLISH=$P" >> "$GITHUB_ENV"

      - name: Test
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon -PlibVersion=$LIB_VERSION build 2>&1 | tee build.log; then
            # make the reason visible as annotations
            grep -E "What went wrong|error:|FAILED|Exception|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: env.PUBLISH == 'true'
        run: ./gradlew --no-daemon -PlibVersion=$LIB_VERSION publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
