# Tests on every push. A tag vX.Y.Z publishes version X.Y.Z of c64gfx-core and c64gfx-swing to GitHub Packages.
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-SNAPSHOT"; fi
          echo "LIB_VERSION=$V" >> "$GITHUB_ENV"

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PlibVersion=$LIB_VERSION build

      - name: Publish to GitHub Packages
        if: github.ref_type == 'tag'
        run: ./gradlew --no-daemon -PlibVersion=$LIB_VERSION publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
